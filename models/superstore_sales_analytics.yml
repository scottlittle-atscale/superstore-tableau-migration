unique_name: superstore_sales_analytics
object_type: model
label: Superstore Sales Analytics
description: Superstore order lines, sales targets and salesperson commission on one model. Built to re-host
  Tableau's shipped Superstore workbook and the public LOD-expression workbooks against a semantic layer.
visible: true
relationships:
- unique_name: fact_order_line_Date_Dimension_Order
  from:
    dataset: fact_order_line
    join_columns:
    - order_date
  to:
    dimension: Date Dimension
    level: Day
  role_play: Order {0}
- unique_name: fact_order_line_Date_Dimension_Ship
  from:
    dataset: fact_order_line
    join_columns:
    - ship_date
  to:
    dimension: Date Dimension
    level: Day
  role_play: Ship {0}
- unique_name: fact_order_line_Customer_Dimension
  from:
    dataset: fact_order_line
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_order_line_Product_Dimension
  from:
    dataset: fact_order_line
    join_columns:
    - product_key
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_order_line_Geography_Dimension
  from:
    dataset: fact_order_line
    join_columns:
    - geo_key
  to:
    dimension: Geography Dimension
    level: Postal Code
- unique_name: fact_sales_target_Date_Dimension_Order
  from:
    dataset: fact_sales_target
    join_columns:
    - order_date
  to:
    dimension: Date Dimension
    level: Day
  role_play: Order {0}
- unique_name: fact_sales_target_Product_Dimension
  from:
    dataset: fact_sales_target
    join_columns:
    - category
  to:
    dimension: Product Dimension
    level: Category
- unique_name: fact_sales_target_Customer_Dimension
  from:
    dataset: fact_sales_target
    join_columns:
    - segment
  to:
    dimension: Customer Dimension
    level: Segment
- unique_name: fact_sales_commission_Geography_Dimension
  from:
    dataset: fact_sales_commission
    join_columns:
    - region
  to:
    dimension: Geography Dimension
    level: Region
- unique_name: fact_sales_commission_Sales_Person_Dimension
  from:
    dataset: fact_sales_commission
    join_columns:
    - sales_person
  to:
    dimension: Sales Person Dimension
    level: Sales Person
